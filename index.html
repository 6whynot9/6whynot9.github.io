<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Firebase Auth + Realtime DB</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    .hidden { display: none; }
    button { padding: 8px 14px; margin-right: 8px; cursor: pointer; }
    .auth-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .auth-box input { padding: 8px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    hr { margin: 20px 0; border: none; border-top: 1px solid #ddd; }
    form { margin: 20px 0; display: flex; gap: 8px; }
    form input { flex: 1; padding: 8px; }
    ul { padding-left: 20px; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>

  <div id="login-section">
    <h2>Вход в систему</h2>

    <!-- Вход и регистрация по почте и паролю -->
    <div class="auth-box">
      <input type="email" id="email-input" placeholder="Email" required>
      <input type="password" id="password-input" placeholder="Пароль (минимум 6 символов)" required>
      <div class="btn-row">
        <button id="email-login-btn" type="button">Войти по почте</button>
        <button id="email-register-btn" type="button">Зарегистрироваться</button>
      </div>
    </div>

    <hr>

    <!-- Вход через сторонние сервисы -->
    <div class="btn-row">
      <button id="github-login" type="button">Войти через GitHub</button>
      <button id="google-login" type="button">Войти с помощью Google</button>
    </div>
  </div>

  <div id="app-section" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <p>Привет, <strong id="user-name"></strong>!</p>
      <button id="logout-btn" type="button">Выйти</button>
    </div>

    <form id="data-form">
      <input type="text" id="data-input" placeholder="Введите новую запись..." required>
      <button type="submit">Добавить</button>
    </form>

    <h3>Список данных из БД:</h3>
    <ul id="data-list"></ul>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import {
      getAuth,
      GithubAuthProvider,
      GoogleAuthProvider,
      signInWithPopup,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
    import {
      getDatabase,
      ref,
      push,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBosTcvCb521hqR_0xxb-aqAQdGquGLVL4",
      authDomain: "lolkek-52859.firebaseapp.com",
      databaseURL: "https://lolkek-52859-default-rtdb.firebaseio.com",
      projectId: "lolkek-52859",
      storageBucket: "lolkek-52859.firebasestorage.app",
      messagingSenderId: "21758364168",
      appId: "1:21758364168:web:b1be8f206e27f25b985fbd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const githubProvider = new GithubAuthProvider();
    const googleProvider = new GoogleAuthProvider();

    const loginSection = document.getElementById("login-section");
    const appSection = document.getElementById("app-section");
    const userNameEl = document.getElementById("user-name");
    const emailInput = document.getElementById("email-input");
    const passwordInput = document.getElementById("password-input");
    const dataForm = document.getElementById("data-form");
    const dataInput = document.getElementById("data-input");
    const dataList = document.getElementById("data-list");

    // Регистрация по почте и паролю
    document.getElementById("email-register-btn").addEventListener("click", () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || password.length < 6) {
        alert("Введите корректный email и пароль не короче 6 символов.");
        return;
      }
      createUserWithEmailAndPassword(auth, email, password)
        .catch(err => alert("Ошибка регистрации: " + err.message));
    });

    // Вход по почте и паролю
    document.getElementById("email-login-btn").addEventListener("click", () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        alert("Введите email и пароль.");
        return;
      }
      signInWithEmailAndPassword(auth, email, password)
        .catch(err => alert("Ошибка входа: " + err.message));
    });

    // Вход через GitHub и Google
    document.getElementById("github-login").addEventListener("click", () => {
      signInWithPopup(auth, githubProvider).catch(err => alert(err.message));
    });

    document.getElementById("google-login").addEventListener("click", () => {
      signInWithPopup(auth, googleProvider).catch(err => alert(err.message));
    });

    // Выход
    document.getElementById("logout-btn").addEventListener("click", () => {
      signOut(auth).catch(err => alert(err.message));
    });

    let unsubscribeDB = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.classList.add("hidden");
        appSection.classList.remove("hidden");
        userNameEl.textContent = user.displayName || user.email || "Пользователь";

        const itemsRef = ref(db, "items");
        unsubscribeDB = onValue(itemsRef, (snapshot) => {
          dataList.innerHTML = "";
          const data = snapshot.val();
          if (data) {
            Object.values(data).forEach((item) => {
              const li = document.createElement("li");
              li.textContent = `${item.text} (добавил: ${item.author})`;
              dataList.appendChild(li);
            });
          } else {
            dataList.innerHTML = "<li>Записей пока нет</li>";
          }
        });
      } else {
        loginSection.classList.remove("hidden");
        appSection.classList.add("hidden");
        dataList.innerHTML = "";
        if (unsubscribeDB) {
          unsubscribeDB();
          unsubscribeDB = null;
        }
      }
    });

    dataForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = dataInput.value.trim();
      const user = auth.currentUser;

      if (text && user) {
        const itemsRef = ref(db, "items");
        push(itemsRef, {
          text: text,
          author: user.displayName || user.email || "Аноним",
          createdAt: Date.now()
        })
        .then(() => {
          dataInput.value = "";
        })
        .catch(err => alert("Ошибка записи: " + err.message));
      }
    });
  </script>
</body>
</html>
